name: Independent Plugin Release
run-name: Plugin release ${{ inputs.plugin_tag }}

on:
  workflow_dispatch:
    inputs:
      plugin_tag:
        description: Existing immutable plugins/<domain>/v<version> tag on main
        required: true
        type: string
      host_tag:
        description: Existing compatible Sub2API release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: plugin-release-${{ inputs.plugin_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLUGIN_TAG: ${{ inputs.plugin_tag }}
      HOST_TAG: ${{ inputs.host_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.plugin_tag }}
          fetch-depth: 0
      - name: Validate immutable source and selected domain
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLUGIN_TAG" =~ ^plugins/([a-z][a-z0-9-]*)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          domain=${BASH_REMATCH[1]}
          version=${BASH_REMATCH[2]}
          [[ "$HOST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-codexrip\.[1-9][0-9]*$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          git rev-parse --verify "refs/tags/$HOST_TAG^{commit}" >/dev/null
          # Reuse main's required checks only when they exercised the same host
          # implementation as the selected release. New host APIs require a
          # host release before independently publishing a plugin that uses them.
          git diff --quiet "$HOST_TAG" HEAD -- backend frontend ':(exclude)**/*_test.go' ':(exclude)**/*.spec.ts' ':(exclude)**/*.test.ts'
          jq -e --arg domain "$domain" '.plugins | any(.directory == $domain)' plugins/bundle.source.json >/dev/null
          jq -e --arg version "$version" --arg id "codexrip.$domain" '.version == $version and .id == $id' "plugins/$domain/manifest.source.json" >/dev/null
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "host_version=${HOST_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the selected independent interface
        env:
          PLUGIN_DOMAIN: ${{ steps.source.outputs.domain }}
        run: |
          pnpm --dir frontend install --frozen-lockfile
          node backend/pkg/extensionapi/ui/build.mjs "$PLUGIN_DOMAIN"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Main already passed required PR checks. Build the selected artifact;
      # do not repeat the host/frontend/business test suites when publishing.
      - name: Build the selected independent program
        working-directory: backend
        env:
          PLUGIN_DOMAIN: ${{ steps.source.outputs.domain }}
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/package-plugin" ./cmd/package-plugin
          "$RUNNER_TEMP/package-plugin" -build-binaries -bundle-source ../plugins/bundle.source.json \
            -plugin-domain "$PLUGIN_DOMAIN" -binary-dir "$RUNNER_TEMP/plugin-binaries" -platform linux-amd64
      - name: Sign the selected package
        working-directory: backend
        env:
          SUB2API_PLUGIN_SIGNING_KEY: ${{ secrets.SUB2API_PLUGIN_SIGNING_KEY }}
          PLUGIN_DOMAIN: ${{ steps.source.outputs.domain }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          HOST_VERSION: ${{ steps.source.outputs.host_version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUB2API_PLUGIN_SIGNING_KEY"
          "$RUNNER_TEMP/package-plugin" -bundle-source ../plugins/bundle.source.json -plugin-domain "$PLUGIN_DOMAIN" \
            -binary-dir "$RUNNER_TEMP/plugin-binaries" -platform linux-amd64 \
            -tested-host-version "$HOST_VERSION" -source-revision "$SOURCE_SHA" \
            -output ../deploy/plugin-bundle/current -key-id codexrip-plugins-v1
          "$RUNNER_TEMP/package-plugin" -verify-bundle ../deploy/plugin-bundle/current/lock.json -tested-host-version "$HOST_VERSION"
      - name: Attest plugin provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: deploy/plugin-bundle/current/*
      - name: Publish without replacing an existing release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          HOST_VERSION: ${{ steps.source.outputs.host_version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "Independent signed plugin package." "Source: $SOURCE_SHA" "Compatible host checked during packaging: $HOST_VERSION" \
            "Upload the .s2plugin using Update package. This keeps its configuration and pins the selected version." > "$RUNNER_TEMP/plugin-notes.md"
          gh release create "$PLUGIN_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$PLUGIN_TAG" \
            --notes-file "$RUNNER_TEMP/plugin-notes.md" deploy/plugin-bundle/current/*.s2plugin deploy/plugin-bundle/current/lock.json
