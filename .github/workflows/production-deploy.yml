name: Production Deploy
run-name: >-
  ${{ inputs.operation == 'rollback' && format('Rollback to {0}', inputs.release_tag) || inputs.operation == 'reconcile-runtime' && format('Reconcile runtime for {0}', inputs.release_tag) || inputs.operation == 'deploy-preserve' && format('Deploy {0} (preserve)', inputs.release_tag) || format('Deploy {0} (explicit)', inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Deploy, reconcile an exact current release, or roll back'
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - deploy-preserve
          - reconcile-runtime
          - rollback
      release_tag:
        description: 'Target release tag; for reconcile, the exact release currently running'
        required: true
        type: string
      expected_current_release_tag:
        description: 'Rollback only: exact release tag currently running in production'
        required: false
        default: ''
        type: string
      confirmation:
        description: 'Type DEPLOY, RECONCILE, or ROLLBACK for the selected operation'
        required: true
        type: string
      cindy_health:
        description: 'Enable Cindy health tracking and exact budget confirmation'
        required: true
        default: false
        type: boolean
      cindy_capability_catalog:
        description: 'Enable the verified Cindy model and protocol catalog'
        required: true
        default: false
        type: boolean
      cindy_search:
        description: 'Enable native-first Cindy Search routing'
        required: true
        default: false
        type: boolean
      image_studio:
        description: 'Enable verified Image Studio capabilities (Cindy-only in this release)'
        required: true
        default: false
        type: boolean
      cindy_responses_image_bridge:
        description: 'Enable the GPT Image 2 Responses image bridge'
        required: true
        default: false
        type: boolean
      overdraft:
        description: 'Enable Codex 5h/7d quota overdraft continuation'
        required: true
        default: false
        type: boolean
      interrupt_business:
        description: 'Temporarily stop Sub2API after backup to drain active requests before recreation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-sub2api
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      expected_current_image_ref: ${{ steps.resolve.outputs.expected_current_image_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      operation: ${{ steps.resolve.outputs.operation }}
      cindy_rollout: ${{ steps.resolve.outputs.cindy_rollout }}
      overdraft: ${{ steps.resolve.outputs.overdraft }}
      maintenance_spec: ${{ steps.resolve.outputs.maintenance_spec }}
      runtime_spec: ${{ steps.resolve.outputs.runtime_spec }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve immutable release image
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_CURRENT_RELEASE_TAG: ${{ inputs.expected_current_release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CINDY_HEALTH: ${{ inputs.cindy_health }}
          CINDY_CAPABILITY_CATALOG: ${{ inputs.cindy_capability_catalog }}
          CINDY_SEARCH: ${{ inputs.cindy_search }}
          IMAGE_STUDIO: ${{ inputs.image_studio }}
          CINDY_RESPONSES_IMAGE_BRIDGE: ${{ inputs.cindy_responses_image_bridge }}
          OVERDRAFT: ${{ inputs.overdraft }}
          INTERRUPT_BUSINESS: ${{ inputs.interrupt_business }}
        shell: bash
        run: |
          set -euo pipefail

          runtime_mode=explicit
          if [[ "$OPERATION" == deploy-preserve ]]; then
            OPERATION=deploy
            runtime_mode=preserve
          fi

          validate_release_tag() {
            [[ "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-codexrip\.[1-9][0-9]*$ ]]
          }

          resolve_release_image() {
            local tag=$1 image_role=$2 tag_commit version image inspect digest image_revision image_platform_v1 release_state release_assets release_body
            local release_image_ref='' release_source='' release_image_count=0 release_source_count=0 line
            local image_line_re='^Image: `([^`]+)`$'
            local source_line_re='^Source: `([0-9a-f]{40})`$'
            validate_release_tag "$tag" || return 1
            release_state=$(gh release view "$tag" --json tagName,isDraft,isPrerelease \
              --jq '[.tagName,.isDraft,.isPrerelease] | @tsv') || return 1
            [[ "$release_state" == "${tag}"$'\tfalse\tfalse' ]] || return 1
            release_assets=$(gh release view "$tag" --json assets --jq '.assets[].name') || return 1
            if grep -Eq '^(seed-descriptor\.json|bundle-manifest\.json|codexrip-reverse-skill-.*\.zip(\.sha256)?|bootstrap-reverse-skill\.(ps1|py))$' <<<"$release_assets"; then
              echo "Release $tag contains a removed Skill-specific asset" >&2
              return 1
            fi
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" main || return 1
            tag_commit=$(git rev-list -n 1 "$tag") || return 1
            [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || return 1
            git merge-base --is-ancestor "$tag_commit" origin/main || return 1
            version="${tag#v}"
            image="ghcr.io/htexplicit/sub2api:${version}"
            inspect=$(docker buildx imagetools inspect "$image") || return 1
            digest=$(awk '$1 == "Digest:" && digest == "" {digest=$2} END {if (digest == "") exit 1; print digest}' <<<"$inspect") || return 1
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            image_revision=$(docker buildx imagetools inspect "${image}@${digest}" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}') || return 1
            [[ "$image_revision" == "$tag_commit" ]] || return 1
            image_platform_v1=$(docker buildx imagetools inspect "${image}@${digest}" --format '{{ index .Image.Config.Labels "io.github.htexplicit.cindy-platform-v1" }}') || return 1
            case "$image_role" in
              platform)
                [[ "$image_platform_v1" == true ]] || return 1
                ;;
              rollback-target)
                [[ "$image_platform_v1" == true || "$image_platform_v1" == false || -z "$image_platform_v1" || "$image_platform_v1" == '<no value>' ]] || return 1
                ;;
              *)
                return 1
                ;;
            esac
            release_body=$(gh release view "$tag" --json body --jq .body) || return 1
            while IFS= read -r line; do
              if [[ "$line" =~ $image_line_re ]]; then
                release_image_ref=${BASH_REMATCH[1]}
                ((release_image_count += 1))
              elif [[ "$line" =~ $source_line_re ]]; then
                release_source=${BASH_REMATCH[1]}
                ((release_source_count += 1))
              fi
            done <<<"$release_body"
            [[ "$release_image_count" -eq 1 && "$release_source_count" -eq 1 ]] || return 1
            [[ "$release_image_ref" == "${image}@${digest}" ]] || return 1
            [[ "$release_source" == "$tag_commit" ]] || return 1
            printf '%s@%s\n' "$image" "$digest"
          }

          version_strictly_less() {
            local target=$1 current=$2 first
            [[ "$target" != "$current" ]] || return 1
            first=$(printf '%s\n%s\n' "$target" "$current" | LC_ALL=C sort -V | head -n 1)
            [[ "$first" == "$target" ]]
          }

          validate_release_tag "$RELEASE_TAG" || exit 1
          case "$OPERATION" in
            deploy)
              [[ "$CONFIRMATION" == DEPLOY ]] || exit 1
              [[ -z "$EXPECTED_CURRENT_RELEASE_TAG" ]] || exit 1
              ;;
            reconcile-runtime)
              [[ "$CONFIRMATION" == RECONCILE ]] || exit 1
              [[ -z "$EXPECTED_CURRENT_RELEASE_TAG" ]] || exit 1
              [[ "$INTERRUPT_BUSINESS" == false ]] || exit 1
              ;;
            rollback)
              [[ "$CONFIRMATION" == ROLLBACK ]] || exit 1
              validate_release_tag "$EXPECTED_CURRENT_RELEASE_TAG" || exit 1
              version_strictly_less "$RELEASE_TAG" "$EXPECTED_CURRENT_RELEASE_TAG" || exit 1
              ;;
            *)
              echo 'Operation must be deploy, reconcile-runtime, or rollback' >&2
              exit 1
              ;;
          esac
          [[ "$runtime_mode" == explicit || "$runtime_mode" == preserve ]] || exit 1
          [[ "$INTERRUPT_BUSINESS" == true || "$INTERRUPT_BUSINESS" == false ]] || exit 1
          if [[ "$runtime_mode" == preserve ]]; then
            [[ "$INTERRUPT_BUSINESS" == false ]] || exit 1
            [[ "$OPERATION" == deploy ]] || exit 1
          else
            for flag in "$CINDY_HEALTH" "$CINDY_CAPABILITY_CATALOG" "$CINDY_SEARCH" "$IMAGE_STUDIO" "$CINDY_RESPONSES_IMAGE_BRIDGE"; do
              [[ "$flag" == true || "$flag" == false ]] || exit 1
            done
            [[ "$OVERDRAFT" == true || "$OVERDRAFT" == false ]] || exit 1
            if [[ "$OPERATION" == rollback ]]; then
              [[ "$INTERRUPT_BUSINESS" == false ]] || exit 1
            fi
          fi

          expected_current_image_ref=''
          case "$OPERATION" in
            deploy|reconcile-runtime)
              image_ref=$(resolve_release_image "$RELEASE_TAG" platform) || exit 1
              ;;
            rollback)
              image_ref=$(resolve_release_image "$RELEASE_TAG" rollback-target) || exit 1
              expected_current_image_ref=$(resolve_release_image "$EXPECTED_CURRENT_RELEASE_TAG" platform) || exit 1
              [[ "$expected_current_image_ref" != "$image_ref" ]] || exit 1
              ;;
          esac

          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "expected_current_image_ref=${expected_current_image_ref}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "operation=${OPERATION}" >> "$GITHUB_OUTPUT"
          if [[ "$runtime_mode" == preserve ]]; then
            echo 'runtime_spec=runtime=preserve' >> "$GITHUB_OUTPUT"
            echo 'cindy_rollout=' >> "$GITHUB_OUTPUT"
            echo 'overdraft=' >> "$GITHUB_OUTPUT"
            echo 'maintenance_spec=' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime_spec=runtime=explicit' >> "$GITHUB_OUTPUT"
            echo "cindy_rollout=cindy=${CINDY_HEALTH},${CINDY_CAPABILITY_CATALOG},${CINDY_SEARCH},${IMAGE_STUDIO},${CINDY_RESPONSES_IMAGE_BRIDGE}" >> "$GITHUB_OUTPUT"
            echo "overdraft=${OVERDRAFT}" >> "$GITHUB_OUTPUT"
            if [[ "$OPERATION" == deploy && "$INTERRUPT_BUSINESS" == true ]]; then
              echo 'maintenance_spec=maintenance=interrupt' >> "$GITHUB_OUTPUT"
            else
              echo 'maintenance_spec=' >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure pinned SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sub2api_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/sub2api_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/sub2api_deploy >/dev/null
      - name: Apply immutable release operation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          OPERATION: ${{ needs.resolve.outputs.operation }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          EXPECTED_CURRENT_IMAGE_REF: ${{ needs.resolve.outputs.expected_current_image_ref }}
          CINDY_ROLLOUT: ${{ needs.resolve.outputs.cindy_rollout }}
          OVERDRAFT: ${{ needs.resolve.outputs.overdraft }}
          MAINTENANCE_SPEC: ${{ needs.resolve.outputs.maintenance_spec }}
          RUNTIME_SPEC: ${{ needs.resolve.outputs.runtime_spec }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$IMAGE_REF" =~ ^ghcr\.io/htexplicit/sub2api:[0-9]+\.[0-9]+\.[0-9]+-codexrip\.[1-9][0-9]*@sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$RUNTIME_SPEC" == runtime=explicit || "$RUNTIME_SPEC" == runtime=preserve ]] || exit 1
          if [[ "$RUNTIME_SPEC" == runtime=explicit ]]; then
            [[ "$CINDY_ROLLOUT" =~ ^cindy=(true|false),(true|false),(true|false),(true|false),(true|false)$ ]] || exit 1
            [[ "$OVERDRAFT" == true || "$OVERDRAFT" == false ]] || exit 1
            [[ -z "$MAINTENANCE_SPEC" || "$MAINTENANCE_SPEC" == maintenance=interrupt ]] || exit 1
            [[ "$OPERATION" == deploy || -z "$MAINTENANCE_SPEC" ]] || exit 1
          else
            [[ -z "$CINDY_ROLLOUT" && -z "$OVERDRAFT" && -z "$MAINTENANCE_SPEC" && "$OPERATION" == deploy ]] || exit 1
          fi
          case "$OPERATION" in
            deploy)
              [[ -z "$EXPECTED_CURRENT_IMAGE_REF" ]] || exit 1
              if [[ "$RUNTIME_SPEC" == runtime=preserve ]]; then
                remote_command="deploy ${IMAGE_REF} runtime=preserve"
              else
                remote_command="deploy ${IMAGE_REF} ${CINDY_ROLLOUT} overdraft=${OVERDRAFT}"
                if [[ -n "$MAINTENANCE_SPEC" ]]; then
                  remote_command+=" $MAINTENANCE_SPEC"
                fi
              fi
              ;;
            reconcile-runtime)
              [[ -z "$EXPECTED_CURRENT_IMAGE_REF" ]] || exit 1
              [[ "$RUNTIME_SPEC" == runtime=explicit ]] || exit 1
              [[ -z "$MAINTENANCE_SPEC" ]] || exit 1
              remote_command="reconcile-runtime ${IMAGE_REF} ${CINDY_ROLLOUT} overdraft=${OVERDRAFT}"
              ;;
            rollback)
              [[ "$EXPECTED_CURRENT_IMAGE_REF" =~ ^ghcr\.io/htexplicit/sub2api:[0-9]+\.[0-9]+\.[0-9]+-codexrip\.[1-9][0-9]*@sha256:[0-9a-f]{64}$ ]] || exit 1
              [[ "$EXPECTED_CURRENT_IMAGE_REF" != "$IMAGE_REF" ]] || exit 1
              remote_command="rollback ${IMAGE_REF} from=${EXPECTED_CURRENT_IMAGE_REF} ${CINDY_ROLLOUT} overdraft=${OVERDRAFT}"
              ;;
            *)
              echo 'Operation must be deploy, reconcile-runtime, or rollback' >&2
              exit 1
              ;;
          esac
          ssh \
            -F /dev/null \
            -i ~/.ssh/sub2api_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$VPS_PORT" \
            "${VPS_USER}@${VPS_HOST}" \
            "$remote_command"
      - name: Verify public health
        env:
          PUBLIC_HEALTH_URL: ${{ secrets.PUBLIC_HEALTH_URL }}
        shell: bash
        run: curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 "$PUBLIC_HEALTH_URL" >/dev/null
