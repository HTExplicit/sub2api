name: Production Deploy
run-name: Deploy ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target immutable release tag; older releases require compatible database migrations'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY to apply the release'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-sub2api
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve immutable release image
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          log() { printf 'RESOLVE|%s\n' "$1" >&2; }

          validate_release_tag() {
            [[ "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-codexrip\.[1-9][0-9]*$ ]]
          }

          resolve_release_image() {
            local tag=$1 tag_commit version image digest image_revision release_state release_body
            local release_image_ref='' release_source='' release_image_count=0 release_source_count=0 line
            local image_line_re='^Image: `([^`]+)`$'
            local source_line_re='^Source: `([0-9a-f]{40})`$'
            validate_release_tag "$tag" || return 1
            release_state=$(gh release view "$tag" --json tagName,isDraft,isPrerelease \
              --jq '[.tagName,.isDraft,.isPrerelease] | @tsv') || return 1
            [[ "$release_state" == "${tag}"$'\tfalse\tfalse' ]] || return 1
            log "fetch-tag"
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" main || return 1
            log "rev-list"
            tag_commit=$(git rev-list -n 1 "$tag") || return 1
            [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || return 1
            git merge-base --is-ancestor "$tag_commit" origin/main || return 1
            version="${tag#v}"
            image="ghcr.io/htexplicit/sub2api:${version}"
            release_body=$(gh release view "$tag" --json body --jq .body) || return 1
            while IFS= read -r line; do
              if [[ "$line" =~ $image_line_re ]]; then
                release_image_ref=${BASH_REMATCH[1]}
                ((release_image_count += 1))
              elif [[ "$line" =~ $source_line_re ]]; then
                release_source=${BASH_REMATCH[1]}
                ((release_source_count += 1))
              fi
            done <<<"$release_body"
            [[ "$release_image_count" -eq 1 && "$release_source_count" -eq 1 ]] || { log "release-body-parse-failed"; return 1; }
            log "release_ref=$release_image_ref"
            [[ "$release_image_ref" == "${image}@"* ]] || { log "release-image-mismatch"; return 1; }
            digest="${release_image_ref#${image}@}"
            log "digest=$digest"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { log "digest-format-failed"; return 1; }
            [[ "$release_image_ref" == "${image}@${digest}" ]] || { log "release-digest-mismatch"; return 1; }
            [[ "$release_source" == "$tag_commit" ]] || { log "release-source-mismatch"; return 1; }
            image_revision=$(docker buildx imagetools inspect "${image}@${digest}" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}') || { log "revision-inspect-failed"; return 1; }
            log "revision=$image_revision"
            [[ "$image_revision" == "$tag_commit" ]] || { log "revision-mismatch"; return 1; }
            printf '%s@%s\n' "$image" "$digest"
          }

          validate_release_tag "$RELEASE_TAG" || exit 1
          [[ "$CONFIRMATION" == DEPLOY ]] || exit 1
          image_ref=$(resolve_release_image "$RELEASE_TAG") || exit 1
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure pinned SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sub2api_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/sub2api_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/sub2api_deploy >/dev/null
      - name: Apply immutable release image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$IMAGE_REF" =~ ^ghcr\.io/htexplicit/sub2api:[0-9]+\.[0-9]+\.[0-9]+-codexrip\.[1-9][0-9]*@sha256:[0-9a-f]{64}$ ]] || exit 1
          remote_command="deploy ${IMAGE_REF}"
          ssh \
            -F /dev/null \
            -i ~/.ssh/sub2api_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$VPS_PORT" \
            "${VPS_USER}@${VPS_HOST}" \
            "$remote_command"
      # The recreated container needs time for startup and migrations; the
      # edge answers 502/503 until then, so keep retrying for up to three minutes.
      - name: Verify public health
        env:
          PUBLIC_HEALTH_URL: ${{ secrets.PUBLIC_HEALTH_URL }}
        shell: bash
        run: curl --fail --silent --show-error --retry 36 --retry-delay 5 --retry-max-time 180 --retry-connrefused --max-time 30 "$PUBLIC_HEALTH_URL" >/dev/null
