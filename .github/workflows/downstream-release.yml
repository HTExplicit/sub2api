name: Downstream Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable codexrip tag on main'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*-codexrip.*'

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: downstream-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag and source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-codexrip\.([1-9][0-9]*)$ ]]
          upstream_version="${BASH_REMATCH[1]}"
          version="${tag#v}"
          git fetch origin main
          source_sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          [[ "$(tr -d '\r\n' < .downstream/upstream-base)" == "v${upstream_version}" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI "$source_sha")" >> "$GITHUB_OUTPUT"
      # Required PR checks admit code to main. Reuse that validation here;
      # publishing verifies immutable source metadata and builds the artifact,
      # rather than rerunning source, frontend, race or migration test suites.

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/htexplicit/sub2api
      VERSION: ${{ needs.verify.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.verify.outputs.upstream_version }}
      BUILD_DATE: ${{ needs.verify.outputs.build_date }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      PROMPT_SHA: c01ea5ce364caf52e28e214162fd36e6d733280aae0bf94fed7ac2ebe8bbb621
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify fixed System Prompt capture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum backend/internal/service/prompts/codexrip_reverse_skill_system_prompt.txt | awk '{print $1}')"
          [[ "$actual" == "$PROMPT_SHA" ]]
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/HTExplicit/sub2api
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.licenses=LGPL-3.0
            io.github.htexplicit.upstream-version=${{ env.UPSTREAM_VERSION }}
            io.github.htexplicit.patch=codexrip
            io.github.htexplicit.cindy-platform-v1=true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ needs.verify.outputs.source_sha }}
            DATE=${{ env.BUILD_DATE }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api-release-amd64
          cache-to: type=gha,mode=max,scope=sub2api-release-amd64
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          Codexrip downstream Sub2API build based on upstream v${UPSTREAM_VERSION}.

          Image: \`${IMAGE}:${VERSION}@${{ steps.build.outputs.digest }}\`
          Source: \`${SOURCE_SHA}\`
          Fixed System Prompt SHA-256: \`${PROMPT_SHA}\`
          Remote Skill source: \`moxinggang\` (paired tree and prompt are activated by the application migration gate)
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sub2API ${VERSION}" \
            --notes-file /tmp/release-notes.md
