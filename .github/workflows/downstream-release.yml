name: Downstream Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable codexrip tag on main'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*-codexrip.*'

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: downstream-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate release tag and source
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-codexrip\.([1-9][0-9]*)$ ]]
          upstream_version="${BASH_REMATCH[1]}"
          version="${tag#v}"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$authorization"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" git fetch origin main
          unset authorization
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse --verify "refs/tags/$tag^{commit}")" == "$source_sha" ]]
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          [[ "$(tr -d '\r\n' < .downstream/upstream-base)" == "v${upstream_version}" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI "$source_sha")" >> "$GITHUB_OUTPUT"
      # Required PR checks admit code to main. Reuse that validation here;
      # publishing verifies immutable source metadata and builds the artifact,
      # rather than rerunning source, frontend, race or migration test suites.

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/htexplicit/sub2api
      VERSION: ${{ needs.verify.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.verify.outputs.upstream_version }}
      BUILD_DATE: ${{ needs.verify.outputs.build_date }}
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - name: Reject existing or uncertain publication slots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 .github/scripts/release_preflight.py --kind host --stage before-build \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release image without publication
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/HTExplicit/sub2api
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.licenses=LGPL-3.0
            io.github.htexplicit.upstream-version=${{ env.UPSTREAM_VERSION }}
            io.github.htexplicit.patch=codexrip
            io.github.htexplicit.cindy-platform-v1=true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ needs.verify.outputs.source_sha }}
            DATE=${{ env.BUILD_DATE }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api-release-amd64
          cache-to: type=gha,mode=max,scope=sub2api-release-amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the checked image without replacing a version
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 .github/scripts/release_preflight.py --kind host --stage before-push \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
          docker push "$IMAGE:$VERSION"
          image_ref=$(docker image inspect --format '{{json .RepoDigests}}' "$IMAGE:$VERSION" | \
            jq -er --arg image "$IMAGE" '[.[] | select(startswith($image + "@"))] | if length == 1 then .[0] else error("ambiguous pushed digest") end')
          digest=${image_ref#"$IMAGE"@}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Create the immutable image release draft
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          Codexrip downstream Sub2API build based on upstream v${UPSTREAM_VERSION}.

          Image: \`${IMAGE}:${VERSION}@${IMAGE_DIGEST}\`
          Source: \`${SOURCE_SHA}\`
          EOF
          python3 .github/scripts/release_preflight.py --kind host --stage before-create \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --image-digest "$IMAGE_DIGEST"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --target "$SOURCE_SHA" \
            --title "Sub2API ${VERSION}" \
            --notes-file /tmp/release-notes.md
      - name: Verify image metadata and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          result=$(python3 .github/scripts/release_preflight.py --kind host --stage before-publish \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --image-digest "$IMAGE_DIGEST")
          RELEASE_ID=$(jq -er '.release_id | select(type == "number" and . > 0)' <<< "$result")
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          gh api --hostname github.com --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
