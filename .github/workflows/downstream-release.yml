name: Downstream Release

on:
  push:
    tags:
      - 'v*.*.*-codexrip.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: downstream-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate release tag and source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-codexrip\.([1-9][0-9]*)$ ]]
          upstream_version="${BASH_REMATCH[1]}"
          version="${tag#v}"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          [[ "$(tr -d '\r\n' < .downstream/upstream-base)" == "v${upstream_version}" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Verify fixed prompt and remote Skill release assets
        run: python3 tools/verify_remote_skill_registry.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Backend downstream tests
        working-directory: backend
        run: |
          go mod verify
          go test -p=1 ./internal/service -run 'Test.*(BusinessSystemPrompt|RemoteSkill|GPT56)' -count=1
          go test -p=1 ./internal/handler/admin ./internal/server/middleware -run 'Test.*(SystemPrompt|RemoteSkill|Audit)' -count=1
          go test -p=1 ./migrations -run 'Test.*(BusinessSystemPromptRemoteSkill|BusinessSystemPromptCodexSkillHybrid|BusinessSystemPromptManagedSource|RemoteSkillRegistry|RemoteSkillSources)' -count=1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend downstream checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm exec vitest run \
            src/api/admin/__tests__/systemPrompts.spec.ts \
            src/views/admin/__tests__/SystemPromptsView.spec.ts \
            src/views/admin/__tests__/systemPromptsIntegrationSurface.spec.ts \
            src/router/__tests__/title.spec.ts

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/htexplicit/sub2api
      VERSION: ${{ needs.verify.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.verify.outputs.upstream_version }}
      BUILD_DATE: ${{ needs.verify.outputs.build_date }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY_MANIFEST_SHA: 098c056d0884602c60b4bcaa2af6b12c52a13718d0fc2a4af40b18497b0c75ac
      REGISTRY_ARCHIVE_SHA: fca0bef795880515c4d9f40322c8f99564c9371bbd01144ab73d7656ccfe8d33
      REGISTRY_ARCHIVE: codexrip-reverse-skill-098c056d0884602c60b4bcaa2af6b12c52a13718d0fc2a4af40b18497b0c75ac.zip
      REGISTRY_CHECKSUM: codexrip-reverse-skill-098c056d0884602c60b4bcaa2af6b12c52a13718d0fc2a4af40b18497b0c75ac.zip.sha256
      PROMPT_SHA: 2107e252ef417561baa4c5349f0c34d4e767ad422dfc463b2eac07bf7bbcc931
      POWERSHELL_BOOTSTRAP_SHA: 2199e8c4e8a09278c9b79e17b05e5457308db0a7d593e0f933ad6bd0712845f9
      PYTHON_BOOTSTRAP_SHA: 353878272c8972c00817cc7171d7a4a087b4203fa2758b7ba1d040ededde7dc9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/HTExplicit/sub2api
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.licenses=LGPL-3.0
            io.github.htexplicit.upstream-version=${{ env.UPSTREAM_VERSION }}
            io.github.htexplicit.patch=codexrip
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ env.BUILD_DATE }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api-release-amd64
          cache-to: type=gha,mode=max,scope=sub2api-release-amd64
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          Codexrip downstream Sub2API build based on upstream v${UPSTREAM_VERSION}.

          Image: \`${IMAGE}:${VERSION}@${{ steps.build.outputs.digest }}\`
          Source: \`${GITHUB_SHA}\`
          Fixed System Prompt SHA-256: \`${PROMPT_SHA}\`
          Remote Skill bundle: \`${REGISTRY_ARCHIVE}\`
          Bundle ZIP SHA-256: \`${REGISTRY_ARCHIVE_SHA}\`
          Bundle manifest SHA-256: \`${REGISTRY_MANIFEST_SHA}\`
          PowerShell bootstrap SHA-256: \`${POWERSHELL_BOOTSTRAP_SHA}\`
          Python bootstrap SHA-256: \`${PYTHON_BOOTSTRAP_SHA}\`
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "deploy/skill-registry/seed/seed-descriptor.json" \
            "deploy/skill-registry/seed/bundle-manifest.json" \
            "deploy/skill-registry/seed/${REGISTRY_ARCHIVE}" \
            "deploy/skill-registry/seed/${REGISTRY_CHECKSUM}" \
            "deploy/skill-registry/bootstrap/${POWERSHELL_BOOTSTRAP_SHA}/bootstrap-reverse-skill.ps1" \
            "deploy/skill-registry/bootstrap/${PYTHON_BOOTSTRAP_SHA}/bootstrap-reverse-skill.py" \
            --verify-tag \
            --title "Sub2API ${VERSION}" \
            --notes-file /tmp/release-notes.md
