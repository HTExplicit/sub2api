name: Downstream Verify

on:
  push:
    branches:
      - main
      - 'sync/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Downstream backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install public UI build dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Release metadata and publisher inventory contracts
        run: |
          python3 .github/scripts/test_release_preflight.py
          go -C backend test ../.github/scripts/initialize_plugin_publisher.go ../.github/scripts/initialize_plugin_publisher_test.go -run '^TestPublisherSecretInventory' -count=1
      - name: Agent protocol contracts
        run: bash .github/scripts/test_agent_protocol.sh
      - name: First-party plugin contracts and signed process package
        run: bash .github/scripts/test_first_party_plugins.sh
      - name: Reasoning replay and recovery contracts
        run: bash .github/scripts/test_reasoning_replay.sh
      - name: Model context capacity contracts
        run: bash .github/scripts/test_model_context_capacity.sh
      - name: Service tests
        working-directory: backend
        run: go test -p=1 -tags unit ./internal/service -run 'Test.*(Refusal|CyberPolicy|Continuation|InvalidEncryptedContent|PreviousResponseNotFound|CapacityShed|RequestScopedTransient|ServerOverloaded|BusinessSystemPrompt|RemoteSkill|Cindy|CompatibilityModes|AlphaSearch)|Test(UpdateService|NormalizeAccountTaxonomyName|FilterConsoleAccounts|AccountConsolePlan|AccountFacetMatcher)' -count=1
      - name: Upstream automation classifier tests
        run: |
          python3 .github/scripts/test_upstream_risk.py
          python3 .github/scripts/test_upstream_automation_contract.py
      - name: OpenAI probe ownership race tests
        working-directory: backend
        run: go test -race -tags unit ./internal/service -run 'TestOpenAIRuntimeBreaker_(APIKeySameAccountRetryDoesNotUseRedisLease|OAuthSameAccountRetryTransfersProbeUntilFinalFailure|SuppressedRetryReleasesSelectionClaim)' -count=1
      - name: Remote Skill concurrency race tests
        working-directory: backend
        run: go test -race ./internal/service -run 'TestMoxinggangRemoteSkillSource(UsesBoundedConcurrencyAndCanonicalUnicodeURLs|FetchesFixedApprovedTreeAndBuildsPairedCandidate)|TestRemoteSkillRegistryKeepsHistorical73ActiveThrough458SeedSyncPublishAndRollback' -count=1
      - name: Cindy HTTP to WebSocket v2 continuation race test
        working-directory: backend
        run: go test -race ./internal/service -run '^TestCindyHTTPToWSV2ContinuationReusesOneConnectionAcrossIndependentHTTPRequests$' -count=1
      - name: Cindy manual balance race tests
        working-directory: backend
        run: go test -race -tags unit ./internal/service ./internal/repository -run '^TestCindyBalanceProbe' -count=1
      - name: Gateway management isolation race test
        working-directory: backend
        run: go test -race ./internal/handler -run '^TestOpenAIBlockedUpstreamsDoNotSerializeManagementPlane$' -count=1
      - name: Plugin policy cancellation race tests
        working-directory: backend
        run: go test -race -tags unit ./internal/service -run '^(TestPluginPolicyCancellationSurvivesUpstreamDetachWithoutCancelingBilling|TestPluginPolicyContextsStopOnConfigurationChangeAndDisable|TestSavingIdenticalPluginConfigurationDoesNotCancelHostWork|TestPluginOwnedHostJobHoldsUpdateLeaseUntilCleanup|TestAccountJobRetryPreservesOwnerAndAdmitsCurrentGeneration|TestLegacyImportJobUsesCurrentPluginLifetimeWithoutRewritingHistory|TestPluginJobCompletionDoesNotCancelButPolicyStopPersistsCancellation)$' -count=1
      - name: Cindy manual balance, split, image, and turn-state tests
        working-directory: backend
        run: |
          go test -p=1 -tags unit ./internal/repository ./internal/service ./internal/handler ./internal/handler/admin -run 'Test.*(AccountCredentialIdentity|AccountJobCindyMutation|ProviderIdentityMismatch|CindyBalanceProbe|CindyGroupSplit|CindyCatalog|CindyCodexModels|ImageStudioEligibleKeys|CindyCompatibility|LegacyCindyRuntimeCompatibility|CodexImageGenerationBridgeOverridePrecedence|TurnStateCommits|SchedulerCache|SchedulerRefresh|KeepsCindyRoutingIdentity|StrictCindyGroup|MaterializesCindyIdentity|DisabledOrdinaryMember|SkipsCindyAggregate|GatewayModelCapabilities|GatewayModels|WriteOpenAIModelsList|AccountHandlerGetAvailableModels|ForwardResponsesOllamaClampPreservesContinuationPolicy|AccountAvailableModels|FetchOpenAIAccountModels|SetAnthropicAPIKeyAuthHeader|OllamaCloud.*(MaxTokens|MaxOutputTokens|Bearer)|Clamps.*OllamaBase)' -count=1
          go test -p=1 -tags unit ./migrations -run 'Test.*(Migration222|Migration223|Migration224|Migration230|Migration231|Migration232|Migration235|Migration236|GroupModelAllowlistRepairMigration|ReleaseAcceptance)' -count=1
      - name: Request body recovery tests
        working-directory: backend
        run: go test -p=1 ./internal/pkg/httputil ./internal/handler -run 'Test(ReadRequestBodyWithPrealloc|ReadLenientJSONRequestBodyWithPrealloc|RequestBodyReadDiagnostics|ClassifyRequestContentEncoding)' -count=1
      - name: Handler tests
        working-directory: backend
        run: |
          go test -p=1 -tags unit ./internal/handler ./internal/handler/admin -run 'Test.*(Refusal|Cyber|Continuation|AlphaSearch|RemoteSkill)' -count=1
          go test -p=1 ./internal/handler/admin -run 'TestUpdateSettings(PartialPayload|RejectsTwoCaptchaProviders|RequiresFourTencentCaptchaCredentials|RetainsStoredTencentCaptchaCredentials|ValidatesTencentCaptchaAppID|ValidatesTurnstileSiteKey)' -count=1
          go test -p=1 ./internal/handler/admin ./internal/service -run 'Test(ExportData|PreviewDataImport|ImportData|DataAccountIdentityKeys|DataIdentityIndex|AccountJobDataImport|OpsMetricsCollectorRecordsDatabasePoolWaitDelta|BulkUpdateAccepts|AccountHandler)' -count=1
          go test -p=1 ./internal/repository -run '^$'
      - name: Account view scope and execution contracts
        working-directory: backend
        run: go test -p=1 -tags unit ./internal/service ./internal/handler/admin ./internal/handler/dto ./internal/repository -run '^(TestAccountView.*|TestCindyRecoveryResourceProjection)$' -count=1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Complete remote Skill closure
        run: |
          python -m pip install 'PyYAML==6.0.2'
          candidate=$(mktemp -d)/security-research
          mkdir -p "$candidate"
          cp -a plugins/prompt-skills/registry/seed/tree/. "$candidate/"
          install -D -m 0644 \
            plugins/prompt-skills/registry/seed/pinned/waf-bypass.md \
            "$candidate/skills/sec-assessment-tooling/pentest-tools/src-hunter/references/payloader/waf-bypass.md"
          python "$candidate/scripts/validate_skill.py" "$candidate" --require-evals --json
      - name: Account taxonomy migration integration test
        working-directory: backend
        run: go test -p=1 -tags integration ./internal/repository -run '^(Test(AccountTaxonomy.*|DeleteAccountFolder.*)Integration|TestAPIKeyRepoSuite/TestReleaseAcceptanceKeyIsHiddenButAuthenticates)$' -count=1
      - name: Cindy balance, identity, and split integration tests
        working-directory: backend
        run: go test -p=1 -tags integration ./internal/repository -run '^Test(CindyBalanceProbe.*|CindyGroupSplit(PreviewDriftAndAtomicCommit|RollsBackAllWritesWhenOutboxInsertFails|KeepsCanonicalSourceAndTreatsLegacyLaxaAsOrdinary)|ClassifyStrictCindyGroupUsesAllNonDeletedMembersAndOpenAIGroup|PGXBatchInsertAuditAndSystemLogs|Migration236.*)$' -count=1
      - name: Cindy defaults migration tests
        working-directory: backend
        run: |
          go test -p=1 ./migrations -run '^(TestMigration(207RestoresOnlyCindyNativeOpenAIModes|208UsesCindyPromptCacheHashOnly|209RestoresOnlyCindyAlphaSearchBridge|210ResetsOnlyLegacyCindyBalanceMarkers|211RestoresOnlyExactUnresolvedCindyBudgetMarkers|213ResetsOnlyStrictCindyBalanceMarkers)|TestMigration235RestrictsLedgerReplayToLifecycleExcludedRows)$' -count=1
          go test -p=1 -tags integration ./migrations -run '^(TestCindy(OpenAIDefaults|PromptCacheHash|AlphaSearchBridge|BalanceMarkerReset|BalanceMarkerRestore|BalanceConfirmationReset|PlatformProjectionRoundTrip)MigrationIsStrictAndIdempotent|TestMigration235PreservesMixedOpenAIGroupsAfterCanonicalReplay)$' -count=1

  frontend:
    name: Downstream frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: |
          pnpm run lint:check
          pnpm run typecheck
          pnpm exec vue-tsc --noEmit -p ../backend/pkg/extensionapi/ui/tsconfig.json
      - name: Focused downstream tests
        working-directory: frontend
        run: |
          pnpm exec vitest run \
            src/components/admin/account/__tests__/AccountTestModal.spec.ts \
            src/components/admin/account/__tests__/AccountTestModal.displayContract.spec.ts \
            src/components/admin/account/__tests__/AccountTestModal.policyPlan.spec.ts \
            src/views/admin/__tests__/SettingsView.spec.ts \
            src/components/common/__tests__/VersionBadge.downstream.spec.ts \
            src/api/__tests__/downstreamStatus.spec.ts \
            src/i18n/__tests__/accountConsoleLocales.spec.ts \
            ../plugins/account-tools/ui/src/__tests__/data-import.spec.ts \
            ../plugins/account-tools/ui/src/__tests__/ImportDataModal.spec.ts \
            src/components/admin/account-jobs/__tests__/AccountTaskDrawer.spec.ts \
            src/stores/__tests__/accountJobs.spec.ts \
            src/composables/__tests__/useAccountSelectionMetadata.spec.ts \
            src/api/__tests__/accountOperationIdempotency.spec.ts \
            src/components/plugins/__tests__/ExtensionSlot.spec.ts \
            src/components/plugins/__tests__/ExtensionFields.spec.ts \
            src/components/plugins/__tests__/AccountViewPage.spec.ts \
            src/components/plugins/__tests__/CindyAccountControls.spec.ts \
            src/components/plugins/__tests__/accountView.spec.ts \
            src/components/plugins/__tests__/accountViewNative.spec.ts \
            src/components/plugins/__tests__/accountViewStepUp.spec.ts \
            src/components/plugins/__tests__/pluginViewDispatch.spec.ts \
            src/components/plugins/__tests__/resourceAvailability.spec.ts \
            src/components/plugins/__tests__/PluginFrame.precondition.spec.ts \
            src/components/plugins/__tests__/resourceClient.spec.ts \
            src/components/plugins/__tests__/localResources.spec.ts \
            src/features/image-studio/history.legacy.spec.ts \
            ../plugins/account-tools/ui/src/__tests__/BatchTestAccountModal.spec.ts \
            ../plugins/account-tools/ui/src/__tests__/BatchTestAccountModal.plan.spec.ts \
            ../plugins/account-tools/ui/src/__tests__/AccountFolderBar.spec.ts \
            ../plugins/account-tools/ui/src/__tests__/AccountTaxonomyManager.spec.ts \
            ../plugins/account-tools/ui/src/__tests__/AccountBulkTaxonomyModal.spec.ts \
            src/components/admin/account/__tests__/AccountBulkActionsBar.spec.ts \
            src/components/admin/account/__tests__/AccountActionMenu.spark_shadow.spec.ts \
            src/components/admin/account/__tests__/AccountConsoleFilters.spec.ts \
            src/components/admin/account/__tests__/AccountUsageViews.spec.ts \
            src/components/admin/usage/__tests__/UsageTable.latency.spec.ts \
            src/components/account/__tests__/AccountUsageCell.spec.ts \
            src/components/account/__tests__/AccountUsageCell.list.spec.ts \
            src/components/account/__tests__/UsageProgressBar.spec.ts \
            src/utils/__tests__/cindyOpenAIDefaults.spec.ts \
            src/components/account/__tests__/CreateAccountModal.spec.ts \
            src/components/account/__tests__/CreateAccountModal.codexFingerprint.spec.ts \
            src/components/payment/__tests__/StripePaymentInline.contrast.spec.ts \
            src/views/user/__tests__/StripePaymentView.spec.ts \
            src/components/account/__tests__/OpenAIReasoningPolicyFields.spec.ts \
            src/utils/__tests__/openaiReasoningPolicy.spec.ts \
            src/components/account/__tests__/EditAccountModal.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.spec.ts \
            src/components/account/__tests__/ModelContextCapacityField.spec.ts \
            src/utils/__tests__/modelContextCapacity.spec.ts \
            src/composables/__tests__/useModelContextCapacities.spec.ts \
            src/api/__tests__/admin.accounts.contextCapacity.spec.ts \
            src/composables/__tests__/useModelWhitelist.spec.ts \
            src/components/account/__tests__/BulkEditAccountModal.spec.ts \
            ../plugins/prompt-skills/ui/src/__tests__/App.spec.ts \
            ../plugins/prompt-skills/ui/src/__tests__/locales.spec.ts \
            src/views/admin/__tests__/AccountsView.console.spec.ts \
            src/views/admin/__tests__/AccountsView.priorityColumn.spec.ts \
            ../plugins/image-tools/ui/src/__tests__/api.spec.ts \
            src/api/__tests__/cindyBalanceProbe.spec.ts \
            src/api/__tests__/admin.groups.cindy-split.spec.ts \
            ../plugins/cindy-provider/ui/src/__tests__/CindyGroupAuditDialog.spec.ts \
            ../plugins/cindy-provider/ui/src/__tests__/CindyBalanceProbePanel.spec.ts \
            ../plugins/cindy-provider/ui/src/__tests__/CindyDuplicateInventoryPanel.spec.ts \
            ../plugins/cindy-provider/ui/src/__tests__/CindyUISecondReview.spec.ts \
            ../plugins/cindy-provider/ui/src/__tests__/ProviderSettings.spec.ts \
            src/features/cindy-balance-probe/__tests__/CindyBalanceProbeSummary.spec.ts \
            src/i18n/__tests__/cindyProbeLocales.spec.ts \
            src/components/layout/__tests__/AppSidebar.spec.ts \
            src/components/layout/__tests__/AppSidebar.simple-mode.spec.ts \
            src/views/admin/__tests__/GroupsView.columnSettings.spec.ts \
            ../plugins/image-tools/ui/src/__tests__/App.spec.ts \
            src/views/admin/__tests__/AccountsView.bulkEdit.spec.ts \
            src/views/admin/__tests__/AccountsView.schedulerScore.spec.ts \
            src/views/admin/__tests__/AccountsView.sparkShadow.spec.ts \
            src/views/admin/__tests__/AccountsView.usageWindowsHint.spec.ts
      - name: MiniMax quota and Grok save compatibility
        working-directory: frontend
        run: |
          pnpm exec vitest run \
            src/constants/__tests__/platforms.spec.ts \
            src/api/__tests__/settings.authSourceDefaults.spec.ts \
            src/components/admin/user/__tests__/UserPlatformQuotaModal.spec.ts \
            src/components/account/__tests__/EditAccountModal.grokMediaEligibility.spec.ts \
            -t 'platform option catalogs|全部 10 平台全 null|缺失平台填充为全 null|MiniMax scheduling threshold compatibility|已有数据正确填充 limit input|保存提交完整 10 platform payload|updates the dedicated endpoint only when the mode changes|reports partial-save errors when the dedicated endpoint fails'
      - name: Production build
        working-directory: frontend
        run: pnpm run build

  candidate-image:
    name: Candidate OCI image
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/sync/')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve candidate compatibility version
        id: version
        shell: bash
        run: printf 'value=%s-candidate\n' "$(tr -d '\r\n' < backend/cmd/server/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=/tmp/sub2api-candidate.tar
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api-candidate-amd64
          cache-to: type=gha,mode=max,scope=sub2api-candidate-amd64
      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sub2api-candidate-linux-amd64-${{ github.sha }}
          path: /tmp/sub2api-candidate.tar
          retention-days: 3
          if-no-files-found: error
