name: Downstream Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  backend:
    name: Downstream backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/selective-ci
        with:
          context: Downstream backend
          workflow: .github/workflows/downstream-verify.yml

  frontend:
    name: Downstream frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/selective-ci
        with:
          context: Downstream frontend
          workflow: .github/workflows/downstream-verify.yml

  candidate-image:
    name: Candidate OCI image
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected source checks
        if: needs.backend.result != 'success' || needs.frontend.result != 'success'
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/selective-ci
        with:
          context: Candidate OCI image
          workflow: .github/workflows/downstream-verify.yml
