name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  backend-security:
    name: backend-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/selective-ci
        with:
          context: backend-security
          workflow: .github/workflows/security-scan.yml

  frontend-security:
    name: frontend-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/selective-ci
        with:
          context: frontend-security
          workflow: .github/workflows/security-scan.yml
