name: Remote Skill Bootstrap Contract

on:
  pull_request:
    paths:
      - 'backend/internal/service/prompts/codexrip_reverse_skill_system_prompt.txt'
      - 'deploy/skill-registry/**'
      - 'tools/build_remote_skill_seed.py'
      - 'tools/test_remote_skill_seed_contract.py'
      - 'tools/test_remote_skill_bootstrap_contract.py'
      - 'tools/verify_remote_skill_registry.py'
      - '.github/workflows/remote-skill-bootstrap-contract.yml'
  push:
    branches: [main]
    paths:
      - 'backend/internal/service/prompts/codexrip_reverse_skill_system_prompt.txt'
      - 'deploy/skill-registry/**'
      - 'tools/build_remote_skill_seed.py'
      - 'tools/test_remote_skill_seed_contract.py'
      - 'tools/test_remote_skill_bootstrap_contract.py'
      - 'tools/verify_remote_skill_registry.py'
      - '.github/workflows/remote-skill-bootstrap-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release registry
        shell: pwsh
        run: python tools/verify_remote_skill_registry.py
      - name: Verify seed and prompt contract
        shell: pwsh
        run: python tools/test_remote_skill_seed_contract.py
      - name: Verify PowerShell and Python bootstrap lifecycle
        shell: pwsh
        run: python tools/test_remote_skill_bootstrap_contract.py
